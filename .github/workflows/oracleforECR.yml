# The Oracle's pipeline. Read it top to bottom, like the Dockerfile.
#
#   push to main ──▶ test ──▶ build-and-push (image to GHCR) ──▶ deploy (SSH to EC2)
#   pull request ──▶ test
#
# Every step here is one of the six commands from Day 1, done by a machine instead of you.

name: oracleforECR

on:
  push:
    branches: [main]
    paths: ["day01/oracle/**", ".github/workflows/oracleforECR.yml"]
  pull_request:
    paths: ["day01/oracle/**", ".github/workflows/oracleforECR.yml"]
  workflow_dispatch:        # the "Run workflow" button, for demos and re-runs

# Two people pushing at once: runs queue up in order instead of racing each other.
concurrency:
  group: oracle-pipeline
  cancel-in-progress: false

env:
  APP_DIR: day01/oracle
  IMAGE_NAME: oracle

jobs:
  # ---------------------------------------------------------------- 1. test
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "day01/oracle/uv.lock"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

  # ------------------------------------------------------ 2. build and push
  build-and-push:
    name: Build image and push to GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # lets the built-in token push to ghcr.io
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Work out the image name
        id: meta
        # ghcr.io requires a lowercase owner; GitHub usernames may not be.
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build for x86 and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          platforms: linux/amd64
          push: true
          # Two tags: an exact one for machines, a moving one for humans.
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------- 3. deploy
push-to-ecr:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - run: |
          src="ghcr.io/paul-sayantan/oracle:${GITHUB_SHA::7}"
          dst="${{ steps.ecr.outputs.registry }}/oracle:${GITHUB_SHA::7}"
          docker pull "$src"
          docker tag "$src" "$dst"
          docker push "$dst"